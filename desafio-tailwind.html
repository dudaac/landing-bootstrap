<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Tailwind CSS</title>

     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen flex items-center justify-center">
    <a href="#produtos" class="bg-[#d63384] hover:bg-[#d63384] text-white font-semibold py-3 px-6 rounded-lg shadow-sm border-2 border-[#d63384] inline-block transition-all">Ver Produtos</a>
    <!-- O Tailwind exigiu mais classes no HTML. No Bootstrap, usamos apenas 3 ou 4 classes 
    (.btn, .btn-lg, .shadow-sm) porque o Bootstrap agrupa dezenas de propriedades CSS dentro 
    de cada classe. No Tailwind, é preciso declarar cada estilo individualmente 
    (bg, text, px, py, rounded, font, shadow, transition).
    O Tailwind é mais fácil de customizar depois pois já que ele não tem estilos pré-definidos,
    exige apenas trocar as classes utilitárias no próprio HTML sem criar regras CSS extras. -->
</body>
</html>
